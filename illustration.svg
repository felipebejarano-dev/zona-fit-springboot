<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración ZonaFit">
  <rect width="100%" height="100%" fill="#f8fafc" />
  <!-- tapis roulant simple -->
  <rect x="50" y="120" width="500" height="20" rx="6" fill="#e6f6ef" stroke="#c7f0dc" />
  <rect x="60" y="100" width="120" height="20" rx="4" fill="#d1fae5" />
  <!-- persona estilizada -->
  <circle cx="200" cy="70" r="18" fill="#0f766e" />
  <rect x="190" y="88" width="20" height="40" rx="8" fill="#0f766e" />
  <line x1="200" y1="110" x2="160" y2="140" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="110" x2="240" y2="140" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
  <!-- elementos amigables -->
  <g font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#064e3b">
    <text x="340" y="60">Tu zona de entrenamiento</text>
    <text x="340" y="80" font-size="12" fill="#166534">Simple, clara y lista para usar</text>
  </g>
</svg>